      cardNumber:
        type: string
        description: resident card number
        example: 12568215Z
        pattern: '[0-9A-Z][0-9]{0,12}[A-Z]'
      certificateNumber:
        type: string
        description: resident certificate number
        example: 12568215Z
        pattern: '[0-9A-Z][0-9]{0,12}[A-Z]'
  Collection_Meta:
    title: Collection_Meta
    properties:
      count:
        type: integer
