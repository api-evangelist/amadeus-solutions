        pattern: '[a-zA-Z]{2}'
      cityName:
        type: string
        description: 'Full city name. Example: Dublin'
        pattern: '[a-zA-Z -]{1,35}'
      stateName:
        type: string
        description: Full state name
      postalBox:
        type: string
        description: E.g. BP 220
  Extended_CabinRestriction:
    allOf:
    - $ref: '#/definitions/CabinRestriction'
    - type: object
